<!-- Clients -->
{% assign current_locale = page.locale | default: site.locale %}
{% assign text = site.data.sitetext[current_locale] | default: site.data.sitetext[site.locale] %}

{% if text.clients %}
<section class="py-5" id="{{ text.clients.section | default: "clients" }}">
  <div class="container">
    <div class="row" {% if text.clients.horizontal-scrolling == "yes" %} id="scrolling-clients" {% endif %}>
      {% for client in text.clients.list %}
      <div class="col-md-3 col-sm-6">
        <a href="{{ client.url }}">
          <img class="img-fluid d-block mx-auto" src="{{ client.logo }}" alt="{{ client.title }}" style="max-height: {{ text.clients.max-height | default: "100px" }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
