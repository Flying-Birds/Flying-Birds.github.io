  intro:
    title: '<a href="https://book.douban.com/subject/35193035/">The Sedona Method</a>'
    text: "Your Key to Lasting Happiness, Success, Peace and Emotional Well-being"
    section: intro 
    image: "assets/img/ref/The Sedona Method.jpg"
    description: >-
      For more than four and a half decades, the Sedona Method has helped hundreds of thousands of people around the world to let go of their suffering, create what they choose, and discover the truth of who they truly are. Using the Sedona Method, you access your natural ability to let go of any unwanted thought or feeling on the spot, even when you are right in the middle of life's greatest challenges. This will free you to quickly and easily have, be, or do all that you choose.<br><br>
      This book will help you learn this quick, easy, yet highly effective way for you to expand your sense of inner security and wellbeing - even in today's challenging and demanding environment.<br><br>
      Tapping into your natural ability to release will allow you to produce results far beyond what you could achieve with any other transformational tool available today. In fact, the results will often seem quite miraculous. We realize that these claims may sound extravagant; however, if you are open, you can attain an inner mastery and true happiness you never dreamed possible.<br><br>
      The Sedona Method is not another should or external fix. It is a powerful way for you to transform yourself and your life from the inside out, easily and permanently.<br><br>
      Hale Dwoskin and this powerful set of tools are featured in in Rhonda Byrne’s books The Secret and The Greatest Secret.<br><br>

