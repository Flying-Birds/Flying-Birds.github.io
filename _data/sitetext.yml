    closebutton: "关闭"


  timeline:
    title: "时间线"
    text: "这是一段关于爱与坚持的旅程，邀请你一起见证我们的成长与改变。"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "初心启程：<br>点亮未来的第一步"
        year: "2021.04.27"
        desc: "这一天，我们怀着对偏远地区青少年教育的深切关怀，正式迈出了第一步。我们希望通过点滴努力，为孩子们打开一扇望向世界的窗，让知识化作翅膀，让视野照亮前路，陪伴他们向阳生长，追逐梦想。"
        image: assets/img/timeline/1.jpg
        alt:
      - title: "互助会启航：<br>搭建心灵的港湾"
        year: "2025.04.21"
        desc: "关注到大家对心理支持的迫切需求，我们发起了互助会。在这里，每一份倾诉都被认真倾听，每一次陪伴都充满力量。我们用理解消融隔阂，让温暖在心灵间静静流淌，成为彼此最坚实的后盾。"
        image: assets/img/timeline/2.jpg
        alt:
      - title: "从一人到两人：<br>风雨同行的力量"
        year: "2025.06.14"
        desc: "窗外雨势正浓，咖啡馆内暖意融融。从独自践行初心，到两个人的撑伞同行，这份公益之路从此多了份笃定。看着雨幕，我想，再大的风雨，两个人都能撑起一片晴天。"
        image: assets/img/timeline/3.jpg
        alt:  
      - title: "伙伴集结成团：<br>携手共筑公益梦"
        year: "2025.09.22"
        desc: "志同道合的伙伴们正式集结成团队。凭借各自的专长与热忱，我们携手前行，希望将这份公益事业做得更扎实、更深远，让更多人感受到这份努力带来的力量。"
        image: assets/img/timeline/4.jpg
        alt: 

        # you can enforce the alignment
        align: right
    end: "成为<br>故事的<br>一部分"

  about:
    title: "我们的故事"
    text: "从最初的梦想出发，我们用行动书写了属于我们的故事。"
