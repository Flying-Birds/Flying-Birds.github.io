      - title: "Where It All Began: <br> The First Step Toward a Brighter Future"
        year: "2021.04.27"
        desc: "On this day, moved by a deep concern for the education of young people in remote communities, we took our first step. Through steady, heartfelt efforts, we hope to open a window onto the wider world for these children—giving knowledge wings, letting broader horizons light the way, and helping them grow toward the sun as they pursue their dreams."
        image: assets/img/timeline/1.jpg
        alt:
      - title: "The Support Group Sets Sail: <br> A Haven for the Heart"
        year: "2025.04.21"
        desc: "Recognizing the urgent need for emotional support, we founded our peer support group. Here, every story is heard with care, and every act of companionship brings strength. Through understanding, we bridge the distance between us and let warmth flow quietly from heart to heart, becoming a steadfast source of support for one another."
        image: assets/img/timeline/2.jpg
        alt:
      - title: "From One to Two: <br> Stronger Through Every Storm"
        year: "2025.06.14"
        desc: "Rain poured outside, while the café glowed with warmth. What began as one person quietly honoring a promise became two people walking beneath the same umbrella, lending new conviction to our charitable journey. As I watched the rain, I thought: however fierce the storm, two people together can hold up a patch of clear sky."
        image: assets/img/timeline/3.jpg
        alt:  
      - title: "Kindred Spirits Unite: <br> Building a Shared Dream of Service"
        year: "2025.09.22"
        desc: "United by a common purpose, a group of like-minded partners officially came together as a team. Bringing our individual strengths and shared passion, we now move forward side by side—working to make this cause stronger, more enduring, and capable of touching even more lives."
