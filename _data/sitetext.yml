ch: &DEFAULT_ZH
  header:
    title: 第十二期活动预告
    text: 认知觉醒
    button: 查看更多
    buttonlink: "#intro"

  intro:
    title: '<a href="https://book.douban.com/subject/35193035/">认知觉醒</a>'
    text: "开启自我改变的原动力"
    section: intro 
    image: "assets/img/posters/2026.07.25 认知觉醒.jpg"
    description: "这是一部可以穿透时间的个人成长方法论。通过“大脑构造、潜意识、元认知”等思维规律，你将真正看清自己；通过“深度学习、关联、反馈”事物规律，你将洞悉如何真正成事！<br><br>
                  如果对自己不了解，我们就会被人的原始天性束缚，这往往会让我们感到很痛苦。然而，如果了解大脑知识，我们就可以观察并指导自己，运用认知的力量去克服天性，从而获得长久而清晰的内在动力，让我们告别绝大多数人生痛苦。<br><br>
                  一个人的认知越清晰，行动就越坚定。本期活动我们邀请到来自中国政法大学的奶酪，通过这本书来帮我们一一拆解：<br><br>
                  为什么我们做事总是急于求成、避难趋易？<br><br>
                  所谓耐心，就是要“咬牙坚持、死磕到底”吗？<br><br>
                  如何彻底告别用“三分钟热情”和“打鸡血”的方式做事？<br><br>
                  如何保持极度专注？如何消除焦虑？如何提高学习能力？……"

  services:
    title: "每月推荐"
    text: "更多推荐阅读书目"
    section: services
    list:
      - title: "我可能错了"
        url: https://book.douban.com/subject/37021120/
        image: assets/img/ref/我可能错了.jpg
      - title: "臣服实验"
