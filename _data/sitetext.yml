en: &DEFAULT_EN
  header:
    title: Preview of the Twelfth Event
    text: Cognitive Awakening
    button: Read more and join us
    buttonlink: "#intro"


  intro:
    title: '<a href="https://book.douban.com/subject/35193035/">Cognitive Awakening</a>'
    text: "Awaken the Inner Drive for Personal Transformation"
    section: intro 
    image: "assets/img/posters/2026.07.25 认知觉醒.jpg"
    description: "This is a personal-growth methodology with the power to stand the test of time. By exploring the principles behind the brain’s structure, the subconscious, and metacognition, you will come to see yourself clearly. By understanding how deep learning, connection, and feedback work, you will gain insight into how to truly accomplish things.<br><br>
                  When we do not understand ourselves, we remain constrained by our primitive instincts, which often causes great pain. Once we understand how the brain works, however, we can observe and guide ourselves. We can use the power of cognition to overcome our instincts, develop lasting and clear inner motivation, and free ourselves from most of life’s suffering.<br><br>
                  The clearer a person’s cognition, the more resolute their actions become. For this event, we have invited Cheese from China University of Political Science and Law to use this book to help us explore, one by one:<br><br>
                  Why are we always eager for quick results and inclined to avoid difficulty?<br><br>
                  Does patience simply mean gritting our teeth and persevering at all costs?<br><br>
                  How can we move beyond doing things with only short-lived enthusiasm or bursts of motivation?<br><br>
                  How can we stay intensely focused, reduce anxiety, and improve our ability to learn?"
   
