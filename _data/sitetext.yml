ch: &DEFAULT_ZH
  header:
    title: 第十二期活动预告
    text: 圣多纳释放法 Part 01 实践篇
    button: 查看更多
    buttonlink: "#intro"

  intro:
    title: '<a href="https://book.douban.com/subject/37241957/?icn=index-latestbook-subject">圣多纳释放法 Part 01 实践篇</a>'
    text: "持久幸福、成功、平静的秘诀"
    section: intro 
    image: "assets/img/ref/圣多纳释放法.jpg"
    description: >-
      圣多纳释放法是一种通过心理层面的放手动作，清理我们在事业、家庭、感情、金钱、健康等方面产生的种种情绪与压力的方法。采用自问自答的方式，让我们学会接纳不完美，帮我们放下执念，启发我们学会转化能量，唤醒我们的内在力量，最终让我们活的更加从容。<br><br>
      这种方法是经过哈佛大学验证的科学高效的内在成长方法。它的命题是””每个人的本质都是快乐、全知、全能而无限存在的，因为积累的习惯、情绪、妄想、压力、关系、定见等而觉察不到。”它的主要逻辑是“每个人对情绪天生就有加以释放的能力，但因长期社会性的影响而逐渐遗忘，只要透过有意识的觉察，这个能力就能立刻恢复。”<br><br>
      书中分为理论和应用两部分，理论深入阐述什么是释放，释放的目标、内容和原理，应用部分则通过真实故事，教大家将方法运用到生活中，解决负面情绪、不良习惯、经济压力、人际关系、情绪性疾病等难题，甚至助力带领一个有凝聚力高效的团队。<br><br>
      书中不仅有观念上的革新：每个人天生具有情绪释放的自然能力；也有具体的体系和方法，比如视觉感知、动觉感知、听觉感知易懂易操作；还经过了40多年的时间检验，在情绪管理领域具有专业性和权威性。<br><br>

